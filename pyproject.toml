[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seti-rf"
version = "0.1.0"
readme = "README.md"
description = "RF signal analysis and radio telescope RFI triage in one distribution"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.11", "h5py>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sigint-cli = "sigint.sigint_cli:main"
sigint-gui = "sigint.gui.app:main"
sigint-rfi = "sigint_rfi.cli:main"

[project.urls]
Repository = "https://github.com/paoloo/seti-rf"

[tool.setuptools.packages.find]
where = ["src", "vendor/src"]
include = ["seti_rf*", "sigint*", "sigint_rfi*"]

[tool.setuptools.package-data]
"sigint.fixtures" = ["*"]
"sigint.workflow" = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests", "vendor/tests"]
