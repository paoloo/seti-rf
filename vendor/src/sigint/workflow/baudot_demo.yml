---
version: 2
title: sigint — Baudot/ITA2 teletype demo
summary: A looped FSK capture carrying a real ITA2 message, decoded live.
author: BEE sigint
license: MIT
description: 'A File Reader loops a synthetic two-tone FSK capture whose bits are a genuine ITA2 teleprinter message (weather report). The Python block forwards batches to the recognition gate subprocess configured for FSK demodulation + named bitstream decoding; the recovered message appears in the Environment under `sigint.waveform_text` and in the gate block console.'
graph:
  - name: file_source
    module: file_reader
    device: cpu
    runtime: native
    provider: generic
    config:
      filepath: /tmp/sigint_fixtures/baudot_50bd_16k.cf32
      fileFormat: raw
      dataType: CF32
      batchSize: 4096
      loop: true
      playing: true
    meta:
      node:
        x: 40
        y: 120
        width: 380
        height: 0
        configCollapsed: false
  - name: sigint_gate
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      code: |-
        # /// script
        # requires-python = ">=3.10"
        # dependencies = ["numpy>=2.0,<3"]
        # ///
        import json
        import struct
        import subprocess
        import numpy as np
        from pathlib import Path

        # recognition gate in a subprocess (numpy can't run inside the
        # CyberEther interpreter). This flowgraph configures it for FSK
        # demodulation + explicit ITA2 decoding of the buffered audio.
        # EDIT THIS: the one machine-specific path — where this repo
        # lives on YOUR machine (used to reach the gate subprocess and
        # the sigint package for the subprocess's PYTHONPATH).
        _REPO = Path("/Users/paolo/Workspace/SRC/Python/BEE/sigint")
        _WORKER = _REPO / "src/sigint/workflow/gate_subprocess.py"
        _PY = "/Users/paolo/Workspace/CONDA/envs/mcp/bin/python3"
        SAMPLE_RATE = 16000.0


        # provision the fixture file (absolute paths in flowgraph yml
        # would break on other machines; resolve from this file instead)
        import shutil as _shutil
        _PKG = _REPO / "src/sigint"
        _FIXTURE = _PKG / "fixtures" / "baudot_50bd_16k.cf32"
        _DEST = Path("/tmp/sigint_fixtures/baudot_50bd_16k.cf32")
        _DEST.parent.mkdir(parents=True, exist_ok=True)
        if not _DEST.exists():
            _shutil.copy(_FIXTURE, _DEST)
        _proc = subprocess.Popen(
            [_PY, str(_WORKER)],
            stdin=subprocess.PIPE, stdout=subprocess.PIPE,
            stderr=open("/tmp/sigint_worker.err", "ab"))

        def _call(payload: dict) -> dict:
            data = json.dumps(payload).encode()
            _proc.stdin.write(struct.pack("<I", len(data)))
            _proc.stdin.write(data)
            _proc.stdin.flush()
            (n,) = struct.unpack("<I", _proc.stdout.read(4))
            return json.loads(_proc.stdout.read(n))

        _call({"cmd": "config",
               "sample_rate": SAMPLE_RATE,
               "demod": True,
               "mark_hz": 2125.0, "space_hz": 1275.0, "baud_hz": 50.0,
               "named_decoders": ["Baudot/ITA2"]})

        _printed_message = [None]

        def compute(ctx):
            x = ctx.inputs[0]
            resp = _call({"cmd": "feed",
                          "data": [float(v.real) for v in x]})
            env = resp["env"]
            ctx.env["sigint"] = env

            # print the message once per burst: on SIGNAL_END the
            # offline decode has seen the complete audio; mid-burst
            # decodes are progressively longer and would spam
            for ev in env.get("events", []):
                if ev["kind"] == "SIGNAL_END":
                    msg = env.get("waveform_text", "")
                    wf = env.get("waveform", "?")
                    clean = "".join(c if 32 <= ord(c) < 127 else "."
                                    for c in msg).strip(".")
                    if clean:
                        print(f"### WAVEFORM: {wf}")
                        print(f"### MESSAGE: {clean}")
                    else:
                        print(f"### burst ended, no message decoded ({wf})")

            # mirror audio downstream for the plots
            ctx.outputs[0][...] = x
            # sampleRate must be F32 (a python float stores F64 and the
            # signal_view renderer rejects non-F32 rates)
            ctx.output_attrs[0]["sampleRate"] = np.float32(SAMPLE_RATE)

        def cleanup():
            try:
                _call({"cmd": "stop"})
            except Exception:
                pass
            _proc.terminate()
      inputCount: 1
      outputCount: 1
      outputTensorSpecs:
        - shape: '[4096]'
          axes: '[S]'
          dtype: CF32
          device: cpu
      throttled: false
    input:
      input0: '${graph.file_source.output.signal}'
    meta:
      node:
        x: 460
        y: 120
        width: 620
        height: 560
        configCollapsed: false
  - name: spectrum_analyzer
    module: spectrum_analyzer
    device: cpu
    runtime: native
    provider: generic
    config:
      lineplotAveraging: 1
      waterfallAveraging: 1
      maxHold: false
      fill: true
      rangeMin: -60
      rangeMax: 0
      waterfallHeight: 256
      splitRatio: 0.5
      xLabel: Frequency (Hz)
      amplitudeLabel: Amplitude (dBFS)
      waterfallLabel: Time
    input:
      buffer: '${graph.sigint_gate.output.output0}'
    meta:
      node:
        x: 1120
        y: 120
        width: 640
        height: 460
        configCollapsed: false
      surface_default:
        attachedHeight: 420
        detachedWidth: 800
        detachedHeight: 600
        detached: false
        detachedConfigOpen: false
