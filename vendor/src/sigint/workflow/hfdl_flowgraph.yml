---
version: 2
title: sigint — HFDL waveform decoder
summary: Real-time waveform recognition on a recorded burst capture.
author: BEE sigint
license: MIT
description: A File Reader loops the raw float32 render of the HFDL-1200bps capture as if it were a live SDR; the Python block forwards each batch to the sigint recognition gate (running in a subprocess with numpy) and republishes the audio for the spectrum/waterfall. Recognition state appears in the flowgraph Environment under `sigint.*`.
graph:
  - name: file_source
    module: file_reader
    device: cpu
    runtime: native
    provider: generic
    config:
      filepath: /tmp/sigint_fixtures/hfdl_1200bps.cf32
      fileFormat: raw
      dataType: CF32
      batchSize: 4096
      loop: true
      playing: true
    meta:
      node:
        x: 40
        y: 120
        width: 380
        height: 0
        configCollapsed: false
  - name: sigint_gate
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |-
        # /// script
        # requires-python = ">=3.10"
        # dependencies = ["numpy>=2.0,<3"]
        # ///
        import json
        import struct
        import subprocess
        from pathlib import Path
        
        # The recognition gate runs in a SEPARATE python process (a
        # real python3 with numpy + scipy + the sigint repo): the
        # CyberEther-embedded interpreter cannot run numpy reliably
        # (RecursionError / multiarray failures inside its dispatch
        # layers). Point _PY at any python where
        #   python -c "import numpy, scipy; import sigint"
        # works with PYTHONPATH=<repo root>.
        # EDIT THIS: the one machine-specific path — where this repo
        # lives on YOUR machine (used to reach the gate subprocess and
        # the sigint package for the subprocess's PYTHONPATH).
        _REPO = Path("/Users/paolo/Workspace/SRC/Python/BEE/sigint")
        _WORKER = _REPO / "src/sigint/workflow/gate_subprocess.py"
        _PY = "/Users/paolo/Workspace/CONDA/envs/mcp/bin/python3"
        SAMPLE_RATE = 8000.0
        

        # provision the fixture file (absolute paths in flowgraph yml
        # would break on other machines; resolve from this file instead)
        import shutil as _shutil
        _PKG = _REPO / "src/sigint"
        _FIXTURE = _PKG / "fixtures" / "hfdl_1200bps.cf32"
        _DEST = Path("/tmp/sigint_fixtures/hfdl_1200bps.cf32")
        _DEST.parent.mkdir(parents=True, exist_ok=True)
        if not _DEST.exists():
            _shutil.copy(_FIXTURE, _DEST)
        _proc = subprocess.Popen(
            [_PY, str(_WORKER)],
            stdin=subprocess.PIPE, stdout=subprocess.PIPE,
            stderr=open("/tmp/sigint_worker.err", "ab"))
        
        def _call(payload: dict) -> dict:
            data = json.dumps(payload).encode()
            _proc.stdin.write(struct.pack("<I", len(data)))
            _proc.stdin.write(data)
            _proc.stdin.flush()
            (n,) = struct.unpack("<I", _proc.stdout.read(4))
            return json.loads(_proc.stdout.read(n))
        
        _printed_classify = [False]   # survives across cycles (globals
                                      # reset only on code reload)
        
        def compute(ctx):
            # input: CF32 batch from the File Reader, as if live
            x = ctx.inputs[0]
            # the gate wants real audio: take the I component
            resp = _call({"cmd": "feed",
                          "data": [float(v.real) for v in x]})
            env = resp["env"]
        
            # top-level env values must be mappings
            ctx.env["sigint"] = env
        
            # report named waveforms in the block console (there is no
            # text block in CyberEther; the console is the readout)
            for ev in env.get("events", []):
                if ev["kind"] == "WAVEFORM":
                    print(f"### WAVEFORM: {env.get('waveform', ev.get('label', '?'))}"
                          f"  CRC {'OK' if env.get('waveform_crc_ok') else 'BAD'}"
                          f"  {env.get('waveform_bytes', '?')} bytes")
                    text = env.get("waveform_text", "")
                    printable = "".join(c if 32 <= ord(c) < 127 else "."
                                        for c in text)
                    print(f"### payload: {printable[:120]}")
                elif ev["kind"] == "SIGNAL_CLASSIFIED" and \
                        not _printed_classify[0]:
                    _printed_classify[0] = True
                    print(f"### signal: {ev.get('label', '?')} "
                          f"({ev.get('snr_db', 0):.0f} dB)")
                elif ev["kind"] == "SIGNAL_START":
                    _printed_classify[0] = False   # new burst -> print
                    print("### burst detected")
        
            # mirror audio downstream for the plots
            out = ctx.outputs[0]
            out[...] = x
            ctx.output_attrs[0]["sampleRate"] = SAMPLE_RATE
        
        def cleanup():
            try:
                _call({"cmd": "stop"})
            except Exception:
                pass
            _proc.terminate()
      file: ''
      inputCount: 1
      outputCount: 1
      outputTensorSpecs:
        - shape: '[4096]'
          axes: '[S]'
          dtype: CF32
          device: cpu
      throttled: false
    input:
      input0: '${graph.file_source.output.signal}'
    meta:
      node:
        x: 1114
        y: 112
        width: 620
        height: 560
        configCollapsed: false
  - name: spectrum_analyzer
    module: spectrum_analyzer
    device: cpu
    runtime: native
    provider: generic
    config:
      lineplotAveraging: 1
      waterfallAveraging: 1
      maxHold: false
      fill: true
      rangeMin: -120
      rangeMax: -20
      waterfallHeight: 256
      splitRatio: 0.5
      xLabel: Frequency (Hz)
      amplitudeLabel: Amplitude (dBFS)
      waterfallLabel: Time
    input:
      buffer: '${graph.file_source.output.signal}'
    meta:
      node:
        x: 449
        y: 205
        width: 640
        height: 460
        configCollapsed: false
      surface_default:
        attachedHeight: 334
        detachedWidth: 800
        detachedHeight: 600
        detached: false
        detachedConfigOpen: false
