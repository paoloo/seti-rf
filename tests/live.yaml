---
version: 2
title: ATA and GPS | real-time replay
graph:
  - name: report
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        ## Real-time detection
        Replay time **${env.live.time_s:.2f} s** · Events **${env.live.count}**

        ATA waterfall · 1064–1735.5 MHz · newest data at bottom

        | Detection | Classification | Time (s) |
        |---|---|---:|
        | ${env.live.events[*].kind} | ${env.live.events[*].classification} | ${env.live.events[*].time_s:.3f} |
    meta:
      node:
        x: 610
        y: 580
        width: 800
        height: 230
  - name: replay
    module: file_reader
    device: cpu
    runtime: native
    provider: generic
    config:
      filepath: /Users/paolo/Workspace/SRC/Python/BEE/seti-rf/dist/cyberether-replay/live.cf32
      fileFormat: raw
      dataType: CF32
      batchSize: 53603
      loop: true
      playing: true
    meta:
      node:
        x: 20
        y: 80
        width: 250
        height: 0
  - name: detector
    module: python
    device: cpu
    runtime: python
    provider: generic
    config:
      source: editor
      code: |-
        import json
        import os
        from pathlib import Path
        import struct
        import subprocess
        import time

        worker = None
        due = None
        path = Path('/Users/paolo/Workspace/SRC/Python/BEE/seti-rf/dist/cyberether-replay/live.json')
        published = 0

        def compute(ctx):
            global due, worker, published
            now = time.monotonic()
            if due is not None and now < due:
                return YIELD(due - now)
            if worker is None:
                env = os.environ.copy()
                source_path = '/Users/paolo/Workspace/SRC/Python/BEE/seti-rf/src:/Users/paolo/Workspace/SRC/Python/BEE/seti-rf/vendor/src'
                if source_path:
                    env["PYTHONPATH"] = source_path
                worker = subprocess.Popen(['/Users/paolo/Workspace/CONDA/envs/core/bin/python', '/Users/paolo/Workspace/SRC/Python/BEE/seti-rf/tools/cyberether_live_replay.py', 'worker'], env=env, stdin=subprocess.PIPE,
                                          stdout=subprocess.PIPE)
            data = memoryview(ctx.inputs[0]).cast("B")
            start, count, dt, _ = struct.unpack_from("<IIdd", data)
            if start == 0:
                published = 0
            due = now + count * dt
            if count < 100:
                due += 4
            worker.stdin.write(data)
            worker.stdin.flush()
            length, = struct.unpack("<I", worker.stdout.read(4))
            report = json.loads(worker.stdout.read(length))
            memoryview(ctx.outputs[0]).cast("B")[:] = worker.stdout.read(1612800)
            events = report["events"]
            ctx.env["live"] = {"time_s": report["time_s"], "count": len(events),
                               "events": events}
            if len(events) != published:
                published = len(events)
                path.write_text(json.dumps(report, indent=2))
                print(json.dumps(report), flush=True)

        def cleanup():
            if worker is not None and worker.poll() is None:
                worker.terminate()
      file: ''
      inputCount: 1
      outputCount: 1
      outputTensorSpecs:
        - shape: '[200, 672, 3]'
          axes: '[B, S, C]'
          dtype: F32
          device: cpu
      throttled: false
    input:
      input0: '${graph.replay.output.signal}'
    meta:
      node:
        x: 300
        y: 80
        width: 275
        height: 433
  - name: waterfall
    module: frame
    device: cpu
    runtime: native
    provider: generic
    config:
      fit: contain
      colormap: grayscale
      autoRange: false
      interpolation: nearest
      xLabel: X (px)
      yLabel: Y (px)
    input:
      frame: '${graph.detector.output.output0}'
    meta:
      node:
        x: 610
        y: 80
        width: 850
        height: 442
      surface_default:
        attachedHeight: 350
        detachedWidth: 1000
        detachedHeight: 420
        detached: false
        configCollapsed: true
        windowId: ''
